*{box-sizing:border-box}

.steps-v li.done:not(:last-child)::before{background:var(--accent)}

@media (prefers-reduced-motion:no-preference){.screen>*{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}

var MAIL_KEY='__WEB3FORMS_KEY__';

function sendMail(subject,lines,done){
  if(mailState==='off'||location.protocol.indexOf('http')!==0){if(done)done(false);return;}
  try{
    fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({access_key:MAIL_KEY,subject:subject,from_name:'Go Clean It',message:lines.join('\n'),botcheck:''})})
    .then(function(res){return res.json().catch(function(){return {};}).then(function(j){return res.ok&&j.success!==false;});})
    .then(function(ok){mailState=ok?'ok':'fail';if(done)done(ok);render();})
    .catch(function(){mailState='fail';if(done)done(false);render();});
  }catch(e){mailState='fail';if(done)done(false);}
}

/* Atomic accept. In shared mode the database decides: the update only matches while assigned is still null. */
function accept(id,u,cb){
  var r=find(id);
  if(!r||!onShift(u)){cb('forbidden');return;}
  if(!(r.assigned===null&&(r.status==='assigned'||r.status==='escalated'))){cb('taken');return;}
  if(!shared){r.assigned=u;ev(r,'accepted',u);notifyGuest(r,'Laporanmu diterima petugas dan segera ditangani.');cb('ok');return;}
  var nr=JSON.parse(JSON.stringify(r));nr.assigned=u;nr.status='accepted';nr.events.push({s:'accepted',at:now(),by:u});
  localVer++;
  sb('items?kind=eq.report&id=eq.'+encodeURIComponent(id)+'&'+encodeURIComponent('data->>assigned')+'=is.null&'+encodeURIComponent('data->>status')+'=in.(assigned,escalated)',
    {method:'PATCH',prefer:'return=representation',body:{data:nr}})
  .then(function(rows){
    if(rows&&rows.length){for(var i=0;i<reports.length;i++){if(reports[i].id===id)reports[i]=nr;}notifyGuest(nr,'Laporanmu diterima petugas dan segera ditangani.');cb('ok');}
    else{lastSig='';cb('taken');}
  }).catch(function(){cb('error');});
}

    a='<div class="field"><span class="lab">Foto sesudah (wajib)</span><div class="photo">'+(r.photos.after?'<img src="'+r.photos.after+'" alt="Foto sesudah">':'<div class="thumb"></div>')
     +'<div class="row" style="flex-direction:column;gap:8px"><span class="btn sec sm filebtn">Ambil foto<input type="file" accept="image/*" data-file="after" id="fa" aria-label="Ambil foto sesudah"></span><button class="btn sec sm" data-act="sample-after">Pakai foto contoh</button></div></div></div>'
     +'<button class="btn" data-act="finish" data-id="'+r.id+'" '+(r.photos.after?'':'disabled')+'>Selesaikan tugas</button>';
  }
  v.body+=a;v.title=esc(room(r.room).name);return v;
}
function supervisorView(){
  if(ui.screen&&ui.screen.type==='sup')return supDetail(ui.screen.id);
  var s=stats(),list=reports.slice().sort(function(a,b){var ea=a.status==='escalated'?0:1,eb=b.status==='escalated'?0:1;return ea-eb||b.created-a.created;});
  return {title:'Ringkasan',tabs:[],body:
    '<div class="meta">'+BUILDING+'</div>'
    +'<div class="stats"><div class="stat"><b>'+(s.med===null?'-':Math.round(s.med)+' mnt')+'</b><span>Median waktu respons<br>Target: di bawah 15 mnt</span></div><div class="stat"><b>'+s.pct+'%</b><span>Laporan diterima<br>Target: minimal 80%</span></div><div class="stat"><b>'+s.open+'</b><span>Laporan terbuka</span></div><div class="stat"><b style="color:'+(s.esc?'var(--crit)':'inherit')+'">'+s.esc+'</b><span>Perlu tindakanmu</span></div></div>'
    +'<div class="label">Semua laporan</div>'+(list.length?list.map(function(r){return repCard(r,'open-sup',r.assigned?' · '+USERS[r.assigned].name:'');}).join(''):'<div class="empty"><b>Belum ada laporan</b>Laporan di fakultasmu muncul di sini.</div>')};
}
function supDetail(id){
  var r=reports.filter(function(x){return x.id===id;})[0],v=reportView(id,true);
  var canRe=r&&OPEN.indexOf(r.status)>-1&&r.status!=='reported';
  if(r&&r.assigned)v.body+='<div class="meta">Petugas: <b>'+USERS[r.assigned].name+'</b></div>';
  if(r&&r.status==='done'||r&&r.status==='closed'){var a=evAt(r,'accepted'),d=evAt(r,'done');v.body+='<div class="meta mono">Respons '+(a?Math.round((a-r.created)/MIN)+' mnt':'-')+' · selesai '+(d?Math.round((d-r.created)/MIN)+' mnt':'-')+(r.rating?' · nilai '+r.rating+'/5':'')+'</div>';}
  if(canRe){
    var opts=Object.keys(USERS).filter(onShift).map(function(k){return '<option value="'+k+'">'+USERS[k].name+'</option>';}).join('');
    v.body+='<div class="card"><b class="h3">Pindahkan ke petugas lain</b><label class="hint" for="rs">Hanya petugas yang sedang shift</label><select id="rs">'+opts+'</select><button class="btn" data-act="reassign" data-id="'+r.id+'">Tugaskan</button></div>';
  }
  return v;
}
function qrCard(label,sub,tok){return '<div class="card"><div class="roomrow"><div class="qrbox" data-url="'+QR_BASE+tok+'"></div><div class="grow"><span class="room">'+esc(label)+'</span><div class="meta">'+esc(sub)+'</div><div class="mono meta" style="word-break:break-all">/r/'+tok+'</div></div></div></div>';}
function adminView(){
  var AT=['Ruangan','QR','Pengguna'];
  if(ui.tab===1){
    var nr=ROOMS.filter(function(r){return !r.common;}).length;
    var rq=ROOMS.filter(function(r){return !r.common;}).map(function(r){return qrCard(r.name,'Stiker pintu · Lantai '+r.floor,r.tok);}).join('');
    var fq=FLOORS.map(function(f){return qrCard('Lantai '+f.n,'Satu stiker untuk '+(floorRooms(f.n).length)+' pilihan ruangan',f.tok);}).join('');
    return {title:'Stiker QR',tabs:AT,body:'<div class="banner p-prog"><b>'+nr+' stiker ruangan + '+FLOORS.length+' stiker lantai = '+(nr+FLOORS.length)+' stiker.</b><br>Stiker pintu langsung membuka ruangan itu. Stiker lantai meminta orang memilih ruangan.</div><div class="label">Stiker lantai</div>'+fq+'<div class="label">Stiker ruangan</div>'+rq+'<div class="hint">Contoh QR asli, bisa dipindai. Di aplikasi sebenarnya ada tombol Unduh PDF stiker.</div>'};
  }
  if(ui.tab===2){
    var us=Object.keys(USERS).map(function(k){var u=USERS[k];return '<div class="user"><div><b>'+esc(u.name)+'</b><div class="meta">'+({reporter:'Pelapor',cleaner:'Petugas'+(u.role==='cleaner'?(u.shift?' · shift aktif':' · tanpa shift'):''),supervisor:'Supervisor',admin:'Admin'}[u.role])+'</div></div><button class="btn sec sm" data-act="toggle" data-id="'+k+'" '+(k==='admin'?'disabled':'')+'>'+(u.active?'Nonaktifkan':'Aktifkan')+'</button></div>';}).join('');
    return {title:'Pengguna',tabs:AT,body:'<div class="meta">Akun nonaktif kehilangan akses saat itu juga. Riwayat laporannya tetap tersimpan.</div><div class="users">'+us+'</div>'};
  }
  var rs=ROOMS.map(function(r){return '<div class="card"><div class="split"><span class="room">'+esc(r.name)+'</span><span class="pill p-done">Aktif</span></div><div class="meta">Lantai '+r.floor+(r.common?' · area umum':'')+'</div></div>';}).join('');
  return {title:'Ruangan',tabs:AT,body:'<div class="meta">'+ROOMS.length+' tempat di '+BUILDING+'. Kode QR berisi teks acak, bukan nomor ruangan, supaya tidak bisa ditebak.</div>'+rs};
}

function render(){
  var u=USERS[ui.user],g=gate(),v;
  if(g)v=g;else v={reporter:reporterView,cleaner:cleanerView,supervisor:supervisorView,admin:adminView}[u.role]();
  var tabs=(v.tabs||[]).map(function(t,i){return '<button class="tab" data-act="tab" data-id="'+i+'" '+(ui.tab===i?'aria-current="page"':'')+'>'+t+'</button>';}).join('');
  var sup=u.role==='supervisor'&&!ui.screen;
  var skel='<div class="sk h1"></div><div class="sk h2"></div><div class="sk h2"></div><div class="sk h3"></div><div class="sk h3"></div>';
  document.getElementById('phone').innerHTML=ui.splash
    ?'<div class="splash"><div class="logo" style="color:var(--accent-deep)">'+IC.broom.replace('<svg','<svg width="44" height="44"')+'</div><h2>Go Clean It</h2><p>Lapor, petugas datang, ruangan bersih.</p><div class="bar"><i></i></div><p style="font-size:13px">Menyiapkan aplikasi…</p></div>'
    :'<header class="appbar">'+(v.back?'<button class="back" data-act="back" aria-label="Kembali">←</button>':'')+'<h2>'+v.title+'</h2><span class="who">'+esc(u.name)+'</span></header>'
    +'<section class="screen" id="screen" aria-busy="'+(!!ui.loading)+'">'+(ui.loading?skel:v.body)+'</section>'+(tabs?'<nav class="tabs">'+tabs+'</nav>':'');
  if(!ui.splash&&!ui.loading&&typeof QRCode!=='undefined'){var qs=document.querySelectorAll('#phone .qrbox');for(var qi=0;qi<qs.length;qi++){new QRCode(qs[qi],{text:qs[qi].dataset.url,width:84,height:84,colorDark:'#10302B',colorLight:'#ffffff'});}}
  if(ui.busy){var sel='[data-act="'+ui.busy.a+'"]'+(ui.busy.id?'[data-id="'+ui.busy.id+'"]':''),bb=document.querySelector('#phone '+sel);
    if(bb){bb.disabled=true;bb.innerHTML='<span class="spin"></span>'+({submit:'Mengirim…',accept:'Menerima…',start:'Memulai…',finish:'Menyimpan…',rate:'Mengirim…',reassign:'Menugaskan…','cancel-yes':'Membatalkan…'}[ui.busy.a]);}}
  var pending=reports.filter(function(r){return r.assigned===null&&(r.status==='assigned'||r.status==='escalated');}).length;
  var roleBtns=Object.keys(USERS).map(function(k){return '<button class="chip" data-act="role" data-id="'+k+'" aria-pressed="'+(ui.user===k)+'">'+USERS[k].label+'</button>';}).join('');
  var log=logs.length?logs.slice(0,5).map(function(l,i){return '<div class="wa"><small>'+(l.mail?'Email ke ':'WhatsApp ke ')+esc(l.to)+' · '+when(l.at)+'</small><p>'+esc(l.text).replace(/\n/g,'<br>')+'</p><button class="tool" data-act="openlog" data-id="'+i+'">'+(l.key?'Buka tugas':'Buka status')+' (simulasi ketuk tautan)</button></div>';}).join(''):'<small>Belum ada pesan. Kirim laporan sebagai pelapor.</small>';
  document.getElementById('topbar').innerHTML='<b>Go Clean It</b><label class="hint" for="rolesel" style="margin:0">Peran</label><select id="rolesel" aria-label="Masuk sebagai">'
    +Object.keys(USERS).map(function(k){return '<option value="'+k+'"'+(ui.user===k?' selected':'')+'>'+USERS[k].label+'</option>';}).join('')
    +'</select><button class="tool" data-act="panel-open">Alat uji</button>';
  document.getElementById('panel').innerHTML=
    '<button class="tool close" data-act="panel-close">Tutup</button><div class="brand"><h1>Alat uji</h1><p>Prototipe klik untuk lapor dan menangani kebersihan ruangan kampus. Data hanya di halaman ini dan hilang saat dimuat ulang.</p></div>'
    +'<div><div class="label">Masuk sebagai</div><div class="roles">'+roleBtns+'</div></div>'
    +'<div><div class="label">Alat uji</div><div class="tools"><button class="tool" data-act="advance">Maju 10 menit ('+when(now())+')</button><button class="tool" data-act="race" '+(pending?'':'disabled')+'>Dedi dan Sari menerima bersamaan</button><button class="tool" data-act="reset">Mulai ulang</button></div></div>'
    +'<div><div class="label">Data bersama</div><div class="banner '+({local:'p-open',connecting:'p-prog',ok:'p-done',fail:'p-esc'}[syncState])+'">'
    +({local:'<b>Hanya di browser ini.</b> Laporan tidak terlihat di HP lain.',connecting:'<b>Menyambung…</b>',ok:'<b>Tersambung.</b> Laporan dibagi ke semua orang yang membuka halaman ini.',fail:'<b>Gagal tersambung ke database.</b> Coba muat ulang.'}[syncState])+'</div></div>'
    +'<div><div class="label">Notifikasi email ke petugas jaga</div><div class="banner '+({off:'p-open',idle:'p-prog',ok:'p-done',fail:'p-esc'}[mailState])+'">'
    +({off:'<b>Belum aktif.</b> Kunci email belum dipasang di versi ini.',idle:'<b>Aktif.</b> Email dikirim saat ada laporan baru atau laporan diteruskan.',ok:'<b>Email terkirim.</b> Cek kotak masuk petugas jaga (cek juga folder spam).',fail:'<b>Email gagal terkirim.</b> Coba lagi dengan tombol uji, atau periksa kunci email.'}[mailState])
    +'</div><div class="tools" style="margin-top:8px"><button class="tool" data-act="testmail" '+(mailState==='off'?'disabled':'')+'>Kirim email uji</button></div></div>'
    +'<div><div class="label">Coba urutan ini</div><ol class="steps"><li><b>Pelapor</b>: pilih pintu, pilih jenis masalah, kirim.</li><li><b>Petugas Dedi</b>: terima, mulai, lalu selesaikan dengan foto sesudah. Lalu buka sebagai Petugas Sari untuk melihat tugas yang sudah diambil.</li><li><b>Pelapor</b>: beri bintang.</li><li><b>Supervisor</b>: lihat median respons. Kirim laporan baru, tekan Maju 10 menit, lalu lihat eskalasi.</li></ol></div>'
    +'<div><div class="label">Pesan WhatsApp yang terkirim (simulasi)</div><div class="log">'+log+'</div></div>'
    +'<details class="how"><summary>Siapa yang perlu login? Bagaimana notifikasi bekerja?</summary>'
    +'<p><b>Pelapor: tidak perlu login dan tidak perlu aplikasi.</b> QR di pintu membuka halaman web. Laporan dicatat pada ruangan itu. Status bisa dilihat lewat tautan, dan kabar bisa dikirim ke WhatsApp kalau nomornya diisi.</p>'
    +'<p><b>Petugas dan supervisor: punya akun, dibuat admin.</b> Laporan baru dikirim ke WhatsApp mereka berisi tautan sekali pakai. Mengetuk tautan langsung membuka tugas tanpa mengetik kata sandi.</p>'
    +'<p><b>Kalau tidak ada yang merespons:</b> dalam 10 menit laporan naik ke supervisor. Pelapor selalu punya tombol Hubungi petugas jaga.</p></details>'
    +'<div><button class="tool" data-act="theme">Tema gelap / terang</button></div>';
}

/* --- events --- */
function rerender(){render();}
function go(screen){ui.screen=screen;rerender();}
/* Loading behaviour: slow actions show a spinner on the button, navigation shows skeleton cards. */
var SLOW={submit:1,accept:1,start:1,finish:1,rate:1,reassign:1,'cancel-yes':1};
var NAV={role:1,tab:1,back:1,'open-report':1,'open-task':1,'open-sup':1,scan:1,'scan-first':1,'scan-floor':1,'pick-room':1,'start-form':1,openlog:1};
var navToken=0;
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||ui.busy||ui.splash)return;
  act(t.dataset.act,t.dataset.id);
});
document.addEventListener('change',function(e){
  if(e.target.id==='rolesel'&&!ui.busy&&!ui.splash)act('role',e.target.value);
});
function act(a,id){
  if(a==='role'&&document.body.classList.contains('open'))document.body.classList.remove('open');
  if(SLOW[a]&&!(a==='finish'&&!find(id).photos.after)){
    var extra=a==='reassign'&&document.getElementById('rs')?document.getElementById('rs').value:null;
    ui.busy={a:a,id:id};rerender();
    setTimeout(function(){ui.busy=null;apply(a,id,extra);rerender();},800);return;
  }
  if(NAV[a]){
    apply(a,id);ui.loading=true;rerender();var k=++navToken;
    setTimeout(function(){if(k===navToken){ui.loading=false;rerender();}},450);return;
  }
  apply(a,id);rerender();
}
function apply(a,id,extra){
  var u=ui.user;
  if(a==='panel-open'){document.body.classList.add('open');return;}
  if(a==='panel-close'){document.body.classList.remove('open');return;}
  if(a==='role'){ui.user=id;ui.tab=0;ui.screen=null;ui.confirm=null;ui.stars=0;ui.comment='';}
  else if(a==='tab'){ui.tab=+id;ui.screen=null;}
  else if(a==='back'){var s=ui.screen;ui.screen=!s?null:s.type==='form'?{type:'room',room:s.room,from:s.from,floor:s.floor}:(s.type==='room'&&s.from==='floor')?{type:'floor',floor:s.floor}:null;ui.confirm=null;}
  else if(a==='scan-first'||a==='scan'){ui.draft={cat:null,note:'',photo:null,wa:''};ui.screen={type:'room',room:a==='scan'?id:ROOMS[0].id};}
  else if(a==='scan-floor'){ui.draft={cat:null,note:'',photo:null,wa:''};ui.screen={type:'floor',floor:+id};}
  else if(a==='pick-room'){ui.screen={type:'room',room:id,from:'floor',floor:ui.screen.floor};}
  else if(a==='start-form'){ui.screen={type:'form',room:ui.screen.room,from:ui.screen.from,floor:ui.screen.floor};}
  else if(a==='openlog'){var l=logs[+id];if(l){if(l.key){ui.user=l.key;ui.tab=0;ui.screen={type:USERS[l.key].role==='supervisor'?'sup':'task',id:l.rid};}else{ui.user='rani';ui.tab=0;ui.screen={type:'report',id:l.rid};}}}
  else if(a==='cat')ui.draft.cat=id;
  else if(a==='submit'){
    var res=createReport(ui.screen.room,ui.draft.cat,ui.draft.note.trim(),ui.draft.photo,(ui.draft.wa||'').trim());
    if(res.err)toast(res.err);
    else if(res.dup){toast('Laporan yang sama sudah ada, jadi kami gabungkan.');ui.screen={type:'report',id:res.dup.id};}
    else{toast('Laporan terkirim. Petugas sudah diberi tahu.');ui.screen={type:'report',id:res.r.id};}
  }
  else if(a==='open-report'){ui.screen={type:'report',id:id};ui.stars=0;ui.comment='';}
  else if(a==='open-task')ui.screen={type:'task',id:id};
  else if(a==='open-sup')ui.screen={type:'sup',id:id};
  else if(a==='cancel-ask')ui.confirm=id;
  else if(a==='cancel-no')ui.confirm=null;
  else if(a==='cancel-yes'){var r=find(id);ev(r,'cancelled',u);ui.confirm=null;toast('Laporan dibatalkan.');}
  else if(a==='star')ui.stars=+id;
  else if(a==='rate'){var rr=find(id);rr.rating=ui.stars;rr.comment=ui.comment;ev(rr,'closed',u);toast('Terima kasih atas penilaianmu.');}
  else if(a==='accept'){accept(id,u,function(res2){if(res2==='ok'){toast('Tugas diterima. Silakan menuju ruangan.');}else if(res2==='error'){toast('Koneksi bermasalah. Coba lagi.');}else{toast('Sudah diambil petugas lain.');ui.screen=null;}rerender();});}
  else if(a==='start'){ev(find(id),'in_progress',u);toast('Status: sedang dikerjakan.');}
  else if(a==='sample-after'){var sa=find(ui.screen.id);sa.photos.after=placeholder('Foto sesudah','#2E7D6B');touch(sa);}
  else if(a==='finish'){var f=find(id);if(!f.photos.after){toast('Tambahkan foto sesudah dulu.');}else{ev(f,'done',u);notifyGuest(f,'Selesai. Buka tautan untuk melihat foto dan memberi nilai.');toast('Tugas selesai. Pelapor bisa memberi nilai.');ui.screen=null;ui.tab=1;}}
  else if(a==='reassign'){if(extra){var q=find(id);q.assigned=extra;ev(q,'accepted',u);toast('Ditugaskan ke '+USERS[extra].name+'.');}}
  else if(a==='toggle'){USERS[id].active=!USERS[id].active;touchUsers();toast(USERS[id].name+(USERS[id].active?' diaktifkan.':' dinonaktifkan. Akses langsung ditutup.'));}
  else if(a==='advance'){reports.forEach(function(r){if(OPEN.indexOf(r.status)>-1){r.created-=10*MIN;r.events.forEach(function(e){e.at-=10*MIN;});touch(r);}});var n=escalateStale();toast(n?n+' laporan diteruskan ke supervisor.':'Waktu maju 10 menit. Tidak ada laporan yang perlu diteruskan.');}
  else if(a==='race'){var q2=reports.filter(function(r){return r.assigned===null&&(r.status==='assigned'||r.status==='escalated');})[0];if(q2){var rr2={};var fin=function(){if(rr2.d!==undefined&&rr2.s!==undefined){toast('Dedi: '+(rr2.d==='ok'?'berhasil':'sudah diambil')+'. Sari: '+(rr2.s==='ok'?'berhasil':'sudah diambil petugas lain')+'.');rerender();}};accept(q2.id,'dedi',function(x){rr2.d=x;fin();});accept(q2.id,'sari',function(y){rr2.s=y;fin();});}}
  else if(a==='reset'){Object.keys(USERS).forEach(function(k){USERS[k].active=true;});ui={user:'rani',tab:0,screen:null,draft:{cat:null,note:'',photo:null},confirm:null,stars:0,comment:''};if(shared){resetShared();toast('Data demo untuk semua orang dikembalikan.');}else{seed();toast('Data demo dikembalikan.');}}
  else if(a==='testmail'){sendMail('[Go Clean It] Email uji',['Ini email uji dari Go Clean It.','Waktu: '+when(now())],function(ok){toast(ok?'Email uji terkirim. Cek kotak masuk dan folder spam.':'Email uji gagal. Cek koneksi atau kunci email.');});}
  else if(a==='theme'){var root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';}
}
function find(id){return reports.filter(function(r){return r.id===id;})[0];}
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.draft;
  if(k==='note')ui.draft.note=e.target.value;if(k==='wa')ui.draft.wa=e.target.value;if(k==='comment')ui.comment=e.target.value;
});
document.addEventListener('change',function(e){
  var kind=e.target.dataset&&e.target.dataset.file;if(!kind||!e.target.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var s=Math.min(1,560/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);var url=c.toDataURL('image/jpeg',.65); /* re-encoding removes EXIF/GPS */
    if(kind==='before')ui.draft.photo=url;else{var fa=find(ui.screen.id);fa.photos.after=url;touch(fa);}rerender();};img.src=fr.result;};
  fr.readAsDataURL(e.target.files[0]);
});
/* Real QR link: ?r=<token> opens that room (or floor) straight away, like scanning a sticker. */
try{
  var qp=new URLSearchParams(location.search).get('r');
  if(qp){
    var qr=ROOMS.filter(function(r){return r.tok===qp;})[0],qf=FLOORS.filter(function(f){return f.tok===qp;})[0];
    if(qr)ui.screen={type:'room',room:qr.id};else if(qf)ui.screen={type:'floor',floor:qf.n};
  }
}catch(e){}
ui.splash=true;render();
if(shared){poll();setInterval(poll,3000);}
setTimeout(function(){ui.splash=false;render();},1700);
})();
</script>
</body></html>
